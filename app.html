<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>やること＆買い物リスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5e7;
      padding: 16px 20px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #1d1d1f;
    }

    .tabs {
      display: flex;
      gap: 0;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: none;
      color: #888;
      border-bottom: 3px solid transparent;
      transition: color .15s, border-color .15s;
    }

    .tab.active {
      color: #007aff;
      border-bottom-color: #007aff;
    }

    .page { display: none; padding: 20px; max-width: 640px; margin: 0 auto; }
    .page.active { display: block; }

    /* ---- 共通フォーム ---- */
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .card h2 {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 120px;
    }

    label {
      font-size: 12px;
      color: #555;
      font-weight: 500;
    }

    input[type="text"], input[type="number"], select {
      padding: 9px 12px;
      border: 1.5px solid #e0e0e2;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      background: #fafafa;
      transition: border-color .15s;
      width: 100%;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #007aff;
      background: #fff;
    }

    .btn-add {
      padding: 9px 20px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-end;
      transition: background .15s;
    }

    .btn-add:hover { background: #0062cc; }

    /* ---- やることリスト ---- */
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f2;
    }

    .todo-item:last-child { border-bottom: none; }

    .todo-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d0d0d5;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, border-color .15s;
    }

    .todo-check.done {
      background: #34c759;
      border-color: #34c759;
    }

    .todo-check.done::after {
      content: '';
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }

    .todo-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
      transition: color .15s;
    }

    .todo-text.done {
      text-decoration: line-through;
      color: #aaa;
    }

    .btn-del {
      background: none;
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .15s, background .15s;
      line-height: 1;
    }

    .btn-del:hover { color: #ff3b30; background: #fff0ee; }

    .btn-edit {
      background: none;
      border: none;
      color: #bbb;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: color .15s, background .15s;
      line-height: 1;
    }

    .btn-edit:hover { color: #007aff; background: #e8f0ff; }

    .edit-form {
      background: #f5f5f7;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .edit-form .form-row { margin: 0; }

    .edit-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-save {
      padding: 7px 16px;
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      padding: 7px 16px;
      background: #e5e5ea;
      color: #333;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ---- 買い物リスト ---- */
    .store-section { margin-bottom: 20px; }

    .store-name-header {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      padding: 6px 12px;
      background: #f0f0f5;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .store-name-header::before { content: '🏪'; font-size: 13px; }

    .shop-item {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity .2s;
    }

    .shop-item.bought {
      opacity: .5;
    }

    .shop-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #d0d0d5;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, border-color .15s;
    }

    .shop-check.bought {
      background: #007aff;
      border-color: #007aff;
    }

    .shop-check.bought::after {
      content: '';
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-1px);
    }

    .shop-info { flex: 1; min-width: 0; }

    .shop-item-name {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shop-item.bought .shop-item-name {
      text-decoration: line-through;
      color: #aaa;
    }

    .shop-meta {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .badge-coupon {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffe69c;
    }

    .badge-price {
      background: #e8f4fd;
      color: #0563a8;
      border: 1px solid #bee3f8;
    }

    .badge-store-coupon {
      background: #fce8ff;
      color: #7b00a8;
      border: 1px solid #e8b0ff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .empty-msg {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 32px 0;
    }

    .coupon-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .coupon-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
      color: #555;
      user-select: none;
    }

    .coupon-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #ff9500;
    }

    #coupon-text-wrap { flex: 1; min-width: 120px; }
    #coupon-text-wrap.hidden { display: none; }

    .compare-row {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .form-row { gap: 6px; }
      .form-group { min-width: 100px; }
    }
  </style>
</head>
<body>

<header>
  <h1>やること＆買い物リスト</h1>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('shop')">買い物</button>
    <button class="tab" onclick="switchTab('todo')">やること</button>
    <button class="tab" onclick="switchTab('compare')">お得比較</button>
  </div>
</header>

<!-- 買い物リスト -->
<div id="page-shop" class="page active">
  <div class="card">
    <h2>新しい買い物</h2>
    <div class="form-row">
      <div class="form-group" style="min-width:130px;flex:0 0 auto;">
        <label for="shop-store-select">お店</label>
        <select id="shop-store-select" onchange="toggleStoreInput()">
          <option value="杏林堂">杏林堂</option>
          <option value="COOP">COOP</option>
          <option value="遠鉄ストア">遠鉄ストア</option>
          <option value="__other__">その他…</option>
        </select>
        <input type="text" id="shop-store-other" placeholder="お店名を入力" style="display:none;margin-top:6px;">
      </div>
      <div class="form-group">
        <label for="shop-item">商品名</label>
        <input type="text" id="shop-item" placeholder="例：牛乳">
      </div>
      <div class="form-group" style="min-width:90px;flex:0 0 auto;">
        <label for="shop-price">価格（任意）</label>
        <input type="number" id="shop-price" placeholder="円" min="0">
      </div>
    </div>
    <div class="form-row" style="margin-top:10px;align-items:flex-start;flex-wrap:wrap;gap:8px;">
      <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <label class="coupon-toggle">
            <input type="checkbox" id="coupon-check" onchange="toggleCoupon('coupon-text-wrap')">
            🎟 商品クーポン
          </label>
          <div id="coupon-text-wrap" class="hidden form-group" style="flex:1;min-width:120px;">
            <input type="text" id="coupon-text" placeholder="内容（任意）">
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <label class="coupon-toggle">
            <input type="checkbox" id="store-coupon-check" onchange="toggleCoupon('store-coupon-text-wrap')">
            🏷 お店クーポン
          </label>
          <div id="store-coupon-text-wrap" class="hidden form-group" style="flex:1;min-width:120px;">
            <input type="text" id="store-coupon-text" placeholder="内容（任意）">
          </div>
        </div>
      </div>
      <button class="btn-add" onclick="addShopItem()">追加</button>
    </div>
  </div>

  <div id="shop-list"></div>
</div>

<!-- やることリスト -->
<div id="page-todo" class="page">
  <div class="card">
    <h2>新しいタスク</h2>
    <div class="form-row">
      <div class="form-group">
        <label for="todo-input">タスク内容</label>
        <input type="text" id="todo-input" placeholder="やることを入力…">
      </div>
      <button class="btn-add" onclick="addTodo()">追加</button>
    </div>
  </div>

  <div class="card">
    <h2>リスト</h2>
    <div id="todo-list"><p class="empty-msg">タスクはまだありません</p></div>
  </div>
</div>

<!-- お得比較 -->
<div id="page-compare" class="page">
  <div class="card">
    <h2>どちらがお得？</h2>
    <p style="font-size:13px;color:#888;margin-bottom:12px;">内容量と価格を入れると、1個（1g）あたりの値段を比べられます。</p>
    <div id="compare-rows"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn-cancel" onclick="addCompareRow()">＋ 商品を追加</button>
      <button class="btn-cancel" onclick="resetCompare()" style="margin-left:auto;">クリア</button>
    </div>
  </div>

  <div class="card" id="compare-result-card" style="display:none;">
    <h2>結果</h2>
    <div id="compare-result"></div>
  </div>
</div>

<script>
  // --- State ---
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  let shopItems = JSON.parse(localStorage.getItem('shopItems') || '[]');

  function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
    localStorage.setItem('shopItems', JSON.stringify(shopItems));
  }

  // --- Tab ---
  const tabOrder = ['shop', 'todo', 'compare'];
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', tabOrder[i] === tab);
    });
    document.getElementById('page-shop').classList.toggle('active', tab === 'shop');
    document.getElementById('page-todo').classList.toggle('active', tab === 'todo');
    document.getElementById('page-compare').classList.toggle('active', tab === 'compare');
  }

  // --- お店プルダウン ---
  function toggleStoreInput() {
    const sel = document.getElementById('shop-store-select').value;
    const other = document.getElementById('shop-store-other');
    other.style.display = sel === '__other__' ? 'block' : 'none';
    if (sel === '__other__') other.focus();
  }

  function getSelectedStore() {
    const sel = document.getElementById('shop-store-select').value;
    if (sel === '__other__') {
      return document.getElementById('shop-store-other').value.trim() || '未設定';
    }
    return sel;
  }

  // --- Todo ---
  function addTodo() {
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now(), text, done: false });
    save();
    renderTodos();
    input.value = '';
    input.focus();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) t.done = !t.done;
    save();
    renderTodos();
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    save();
    renderTodos();
  }

  function renderTodos() {
    const el = document.getElementById('todo-list');
    if (!todos.length) {
      el.innerHTML = '<p class="empty-msg">タスクはまだありません</p>';
      return;
    }
    el.innerHTML = todos.map(t => `
      <div class="todo-item" id="todo-${t.id}">
        <div class="todo-check ${t.done ? 'done' : ''}" onclick="toggleTodo(${t.id})"></div>
        <span class="todo-text ${t.done ? 'done' : ''}">${esc(t.text)}</span>
        <button class="btn-edit" onclick="startEditTodo(${t.id})">✏️</button>
        <button class="btn-del" onclick="deleteTodo(${t.id})">×</button>
      </div>
    `).join('');
  }

  function startEditTodo(id) {
    const t = todos.find(t => t.id === id);
    if (!t) return;
    const el = document.getElementById(`todo-${id}`);
    el.innerHTML = `
      <div class="edit-form" style="flex:1;">
        <input type="text" id="edit-todo-${id}" value="${esc(t.text)}" style="width:100%;">
        <div class="edit-actions">
          <button class="btn-cancel" onclick="renderTodos()">キャンセル</button>
          <button class="btn-save" onclick="saveTodo(${id})">保存</button>
        </div>
      </div>
    `;
    document.getElementById(`edit-todo-${id}`).focus();
    document.getElementById(`edit-todo-${id}`).addEventListener('keydown', e => {
      if (e.key === 'Enter') saveTodo(id);
      if (e.key === 'Escape') renderTodos();
    });
  }

  function saveTodo(id) {
    const t = todos.find(t => t.id === id);
    const val = document.getElementById(`edit-todo-${id}`).value.trim();
    if (!val) return;
    t.text = val;
    save();
    renderTodos();
  }

  document.getElementById('todo-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTodo();
  });

  // --- Shop ---
  function toggleCoupon(wrapId) {
    const checkId = wrapId === 'coupon-text-wrap' ? 'coupon-check' : 'store-coupon-check';
    const checked = document.getElementById(checkId).checked;
    document.getElementById(wrapId).classList.toggle('hidden', !checked);
  }

  function addShopItem() {
    const store = getSelectedStore();
    const item  = document.getElementById('shop-item').value.trim();
    const price = document.getElementById('shop-price').value;
    const hasCoupon = document.getElementById('coupon-check').checked;
    const couponText = document.getElementById('coupon-text').value.trim();
    const hasStoreCoupon = document.getElementById('store-coupon-check').checked;
    const storeCouponText = document.getElementById('store-coupon-text').value.trim();

    if (!item) { document.getElementById('shop-item').focus(); return; }

    shopItems.push({
      id: Date.now(),
      store,
      item,
      price: price !== '' ? Number(price) : null,
      coupon: hasCoupon,
      couponText,
      storeCoupon: hasStoreCoupon,
      storeCouponText,
      bought: false
    });
    save();
    renderShop();

    document.getElementById('shop-store-select').value = '杏林堂';
    document.getElementById('shop-store-other').style.display = 'none';
    document.getElementById('shop-store-other').value = '';
    document.getElementById('shop-item').value = '';
    document.getElementById('shop-price').value = '';
    document.getElementById('coupon-check').checked = false;
    document.getElementById('coupon-text').value = '';
    document.getElementById('coupon-text-wrap').classList.add('hidden');
    document.getElementById('store-coupon-check').checked = false;
    document.getElementById('store-coupon-text').value = '';
    document.getElementById('store-coupon-text-wrap').classList.add('hidden');
    document.getElementById('shop-item').focus();
  }

  // Enterキーで誤送信しないよう無効化

  function toggleBought(id) {
    const s = shopItems.find(s => s.id === id);
    if (s) s.bought = !s.bought;
    save();
    renderShop();
  }

  function deleteShopItem(id) {
    shopItems = shopItems.filter(s => s.id !== id);
    save();
    renderShop();
  }

  function renderShop() {
    const el = document.getElementById('shop-list');
    if (!shopItems.length) {
      el.innerHTML = '<p class="empty-msg" style="padding:32px 0;text-align:center;color:#bbb;font-size:14px;">買い物リストはまだありません</p>';
      return;
    }

    // group by store (未購入を上に、購入済みを下に)
    const active = shopItems.filter(s => !s.bought);
    const bought = shopItems.filter(s => s.bought);
    const ordered = [...active, ...bought];

    const stores = [...new Set(ordered.map(s => s.store))];

    el.innerHTML = stores.map(store => {
      const items = ordered.filter(s => s.store === store);
      const sc = items.find(s => s.storeCoupon);
      const storeCouponBadge = sc
        ? `<span class="badge badge-store-coupon">🏷 ${sc.storeCouponText ? esc(sc.storeCouponText) : 'お店クーポン使う！'}</span>`
        : '';
      return `
        <div class="store-section">
          <div class="store-name-header">${esc(store)} ${storeCouponBadge}</div>
          ${items.map(s => `
            <div class="shop-item ${s.bought ? 'bought' : ''}" id="shop-${s.id}">
              <div class="shop-check ${s.bought ? 'bought' : ''}" onclick="toggleBought(${s.id})"></div>
              <div class="shop-info">
                <div class="shop-item-name">${esc(s.item)}</div>
                <div class="shop-meta">
                  ${s.coupon ? `<span class="badge badge-coupon">🎟 ${s.couponText ? esc(s.couponText) : 'クーポン使う！'}</span>` : ''}
                  ${s.price !== null ? `<span class="badge badge-price">¥${s.price.toLocaleString()}</span>` : ''}
                </div>
              </div>
              <button class="btn-edit" onclick="startEditShop(${s.id})">✏️</button>
              <button class="btn-del" onclick="deleteShopItem(${s.id})">×</button>
            </div>
          `).join('')}
        </div>
      `;
    }).join('');
  }

  function startEditShop(id) {
    const s = shopItems.find(s => s.id === id);
    if (!s) return;
    const el = document.getElementById(`shop-${id}`);
    el.innerHTML = `
      <div class="edit-form" style="flex:1;">
        <div class="form-row">
          <div class="form-group" style="min-width:100px;flex:0 0 auto;">
            <label>お店</label>
            <input type="text" id="es-store-${id}" value="${esc(s.store)}">
          </div>
          <div class="form-group">
            <label>商品名</label>
            <input type="text" id="es-item-${id}" value="${esc(s.item)}">
          </div>
          <div class="form-group" style="min-width:80px;flex:0 0 auto;">
            <label>価格</label>
            <input type="number" id="es-price-${id}" value="${s.price !== null ? s.price : ''}" placeholder="円" min="0">
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
          <label class="coupon-toggle">
            <input type="checkbox" id="es-coupon-${id}" ${s.coupon ? 'checked' : ''} onchange="document.getElementById('es-coupontext-wrap-${id}').style.display=this.checked?'flex':'none'">
            🎟 商品クーポン
          </label>
          <div id="es-coupontext-wrap-${id}" style="${s.coupon ? '' : 'display:none;'}flex:1;min-width:120px;">
            <input type="text" id="es-coupontext-${id}" value="${esc(s.couponText || '')}" placeholder="内容（任意）" style="width:100%;">
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <label class="coupon-toggle">
            <input type="checkbox" id="es-storecoupon-${id}" ${s.storeCoupon ? 'checked' : ''} onchange="document.getElementById('es-storecoupontext-wrap-${id}').style.display=this.checked?'flex':'none'">
            🏷 お店クーポン
          </label>
          <div id="es-storecoupontext-wrap-${id}" style="${s.storeCoupon ? '' : 'display:none;'}flex:1;min-width:120px;">
            <input type="text" id="es-storecoupontext-${id}" value="${esc(s.storeCouponText || '')}" placeholder="内容（任意）" style="width:100%;">
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn-cancel" onclick="renderShop()">キャンセル</button>
          <button class="btn-save" onclick="saveShop(${id})">保存</button>
        </div>
      </div>
    `;
    document.getElementById(`es-item-${id}`).focus();
  }

  function saveShop(id) {
    const s = shopItems.find(s => s.id === id);
    const item = document.getElementById(`es-item-${id}`).value.trim();
    if (!item) return;
    s.store = document.getElementById(`es-store-${id}`).value.trim() || '未設定';
    s.item = item;
    const price = document.getElementById(`es-price-${id}`).value;
    s.price = price !== '' ? Number(price) : null;
    s.coupon = document.getElementById(`es-coupon-${id}`).checked;
    s.couponText = document.getElementById(`es-coupontext-${id}`).value.trim();
    s.storeCoupon = document.getElementById(`es-storecoupon-${id}`).checked;
    s.storeCouponText = document.getElementById(`es-storecoupontext-${id}`).value.trim();
    save();
    renderShop();
  }

  // --- お得比較 ---
  let compareCount = 0;

  function addCompareRow(label) {
    compareCount++;
    const n = compareCount;
    const div = document.createElement('div');
    div.className = 'compare-row';
    div.id = `cmp-row-${n}`;
    div.innerHTML = `
      <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:4px;">商品${n}</div>
      <div class="form-row">
        <div class="form-group">
          <label>商品名（任意）</label>
          <input type="text" id="cmp-name-${n}" placeholder="例：お徳用パック" oninput="calcCompare()">
        </div>
        <div class="form-group" style="min-width:90px;flex:0 0 auto;">
          <label>内容量</label>
          <input type="number" id="cmp-amount-${n}" placeholder="例：500" min="0" step="any" oninput="calcCompare()">
        </div>
        <div class="form-group" style="min-width:90px;flex:0 0 auto;">
          <label>価格（円）</label>
          <input type="number" id="cmp-price-${n}" placeholder="例：398" min="0" oninput="calcCompare()">
        </div>
      </div>
    `;
    document.getElementById('compare-rows').appendChild(div);
  }

  function resetCompare() {
    document.getElementById('compare-rows').innerHTML = '';
    compareCount = 0;
    addCompareRow();
    addCompareRow();
    document.getElementById('compare-result-card').style.display = 'none';
  }

  function calcCompare() {
    const rows = [];
    for (let n = 1; n <= compareCount; n++) {
      const el = document.getElementById(`cmp-amount-${n}`);
      if (!el) continue;
      const amount = Number(el.value);
      const price = Number(document.getElementById(`cmp-price-${n}`).value);
      const name = document.getElementById(`cmp-name-${n}`).value.trim() || `商品${n}`;
      if (amount > 0 && price > 0) {
        rows.push({ n, name, amount, price, unit: price / amount });
      }
    }

    const card = document.getElementById('compare-result-card');
    if (rows.length < 2) {
      card.style.display = 'none';
      return;
    }

    const best = Math.min(...rows.map(r => r.unit));
    card.style.display = 'block';
    document.getElementById('compare-result').innerHTML = rows.map(r => {
      const isBest = r.unit === best;
      const diff = isBest ? '' : `<span style="font-size:11px;color:#999;">（+${(r.unit - best).toFixed(2)}円）</span>`;
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:10px;${isBest ? 'background:#e9f9ee;border:1.5px solid #34c759;' : 'background:#f5f5f7;'}">
          <div style="flex:1;">
            <div style="font-size:14px;font-weight:600;">${isBest ? '🏆 ' : ''}${esc(r.name)}</div>
            <div style="font-size:12px;color:#888;">${r.amount}あたり ¥${r.price.toLocaleString()}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:16px;font-weight:700;${isBest ? 'color:#1ea94c;' : 'color:#555;'}">${r.unit.toFixed(2)}円</div>
            <div style="font-size:11px;color:#999;">1あたり ${diff}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // init
  renderTodos();
  renderShop();
  addCompareRow();
  addCompareRow();
</script>
</body>
</html>
